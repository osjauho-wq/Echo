<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo YouTube</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;font:18px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #player{position:fixed;inset:0;width:100%;height:100%}
  #inicio{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;background:#0f0f0f}
  #inicio h1{margin:0;font-size:34px}
  #inicio p{margin:0;color:#bbb;max-width:560px}
  button{font:inherit;font-weight:700;font-size:22px;border:0;border-radius:40px;padding:18px 40px;background:#ff0033;color:#fff;cursor:pointer}
  #estado{position:fixed;left:16px;bottom:14px;font-size:14px;color:#aaa;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:20px;transition:opacity .6s}
  #estado.oculto{opacity:0}
  #barra{position:fixed;top:0;left:0;right:0;display:none;gap:10px;justify-content:center;padding:10px;background:linear-gradient(#000c,#0000);transition:opacity .6s}
  #barra button{font-size:16px;padding:10px 18px;background:#ffffff22}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#888;margin-right:6px;vertical-align:middle}
  .on{background:#2ecc71}.off{background:#e74c3c}
</style>
</head>
<body>
<div id="player"></div>

<div id="inicio">
  <h1>📺 Echo YouTube <small style="font-size:14px;color:#888">v4</small></h1>
  <p>Toca el botón una vez. Luego, desde tu iPhone, comparte un video de YouTube con el atajo <b>"Enviar a Echo"</b> y se reproducirá aquí.</p>
  <button id="activar">Activar pantalla</button>
</div>

<div id="barra">
  <button id="bPausa">⏯ Pausa / Play</button>
  <button id="bFull">⛶ Pantalla completa</button>
</div>

<div id="estado"><span class="dot" id="dot"></span><span id="txt">Desconectado</span></div>

<script>
{
  // Canal privado: debe ser EXACTAMENTE el mismo que usa el atajo del iPhone
  const CANAL = 'echo-javi-u0o8xjks6kqn5tniga4uaa';
  const SERVIDOR = 'https://ntfy.sh';

  const $ = id => document.getElementById(id);
  let player = null, listo = false, pendiente = null, ultimoId = null, timerEstado;

  function estado(texto, ok){
    $('txt').textContent = texto;
    $('dot').className = 'dot ' + (ok ? 'on' : 'off');
    $('estado').classList.remove('oculto');
    clearTimeout(timerEstado);
    if (ok) timerEstado = setTimeout(() => $('estado').classList.add('oculto'), 5000);
  }

  // Solo acepta links de YouTube (video y/o lista); cualquier otra cosa se ignora
  function leerLink(texto){
    if (!texto) return null;
    const t = String(texto);
    if (!/(youtube\.com|youtu\.be)/i.test(t)) return null;
    const v = (t.match(/(?:[?&]v=|youtu\.be\/|shorts\/|live\/|embed\/)([A-Za-z0-9_-]{11})/) || [])[1] || null;
    const list = (t.match(/[?&]list=([A-Za-z0-9_-]+)/) || [])[1] || null;
    return (v || list) ? { v, list } : null;
  }

  // Comandos de texto: siguiente, anterior, pausa, play, subir, bajar
  function comando(texto){
    const c = String(texto || '').trim().toLowerCase();
    if (!listo || !c) return false;
    if (/^(siguiente|next|>)$/.test(c)) { player.getPlaylist() ? player.nextVideo() : player.seekTo(player.getDuration() - 1, true); estado('⏭ Siguiente', true); return true; }
    if (/^(anterior|prev|<)$/.test(c)) { player.getPlaylist() ? player.previousVideo() : player.seekTo(0, true); estado('⏮ Anterior', true); return true; }
    if (/^(pausa|pause)$/.test(c)) { player.pauseVideo(); estado('⏸ Pausa', true); return true; }
    if (/^(play|seguir|continuar)$/.test(c)) { player.playVideo(); estado('▶ Play', true); return true; }
    if (/^(subir|\+)$/.test(c)) { player.unMute(); player.setVolume(Math.min(100, player.getVolume() + 15)); estado('🔊 Volumen ' + player.getVolume(), true); return true; }
    if (/^(bajar|-)$/.test(c)) { player.setVolume(Math.max(0, player.getVolume() - 15)); estado('🔉 Volumen ' + player.getVolume(), true); return true; }
    return false;
  }

  function cargar(p){
    if (p.list) {
      const idx = 0;
      player.loadPlaylist({ list: p.list, listType: 'playlist', index: idx });
      // Si venía un video concreto dentro de la lista, se salta a él cuando cargue
      if (p.v) setTimeout(() => { try { const l = player.getPlaylist() || []; const i = l.indexOf(p.v); if (i > 0) player.playVideoAt(i); } catch(_) {} }, 1500);
    } else {
      // Video suelto: se arma su Mix automático (como la reproducción automática de YouTube)
      player.loadPlaylist({ list: 'RD' + p.v, listType: 'playlist', index: 0 });
      setTimeout(() => { try { const l = player.getPlaylist(); if (!l || !l.length) player.loadVideoById(p.v); } catch(_) { player.loadVideoById(p.v); } }, 4000);
    }
  }

  function reproducir(p){
    ultimoId = p.v || p.list;
    estado(p.list ? 'Lista recibida: sigue sola canción tras canción' : 'Video recibido · seguirá con su Mix', true);
    if (!window.YT || !YT.Player) { pendiente = p; return; }
    if (!player) { crearPlayer(p); return; }
    if (listo) cargar(p); else pendiente = p;
  }

  // Cargar la API oficial de YouTube
  function cargarYouTube(){
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
  // El reproductor se crea recién cuando llega el primer pedido
  function crearPlayer(p){
    const vars = { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin };
    vars.listType = 'playlist'; vars.list = p.list || ('RD' + p.v);
    player = new YT.Player('player', {
      width: '100%', height: '100%', videoId: p.v || undefined, playerVars: vars,
      events: {
        onReady: e => {
          listo = true; e.target.playVideo();
          // Si el Mix no cargó, al menos reproduce el video solo
          setTimeout(() => { try { const l = player.getPlaylist(); if ((!l || !l.length) && p.v) player.loadVideoById(p.v); } catch(_) {} }, 4000);
          if (pendiente) { const q = pendiente; pendiente = null; cargar(q); }
        },
        onError: e => {
          if (!ultimoId) return;
          const msg = (e.data == 101 || e.data == 150) ? 'El dueño no permite verlo fuera de YouTube'
                    : e.data == 100 ? 'Video no encontrado o privado'
                    : e.data == 2 ? 'Link no válido'
                    : 'No se pudo reproducir';
          estado(msg + ' (código ' + e.data + ')', false);
          // En una lista, si una canción está bloqueada, salta a la siguiente
          try { if (player.getPlaylist()) setTimeout(() => player.nextVideo(), 1500); } catch(_) {}
        }
      }
    });
  }
  window.onYouTubeIframeAPIReady = function(){
    if (pendiente) { const q = pendiente; pendiente = null; crearPlayer(q); }
  };

  // Escuchar el canal (se reconecta solo si se corta)
  function conectar(){
    const es = new EventSource(SERVIDOR + '/' + CANAL + '/sse');
    es.onopen = () => estado('Conectado (v4) · esperando videos', true);
    es.onmessage = ev => {
      try {
        const d = JSON.parse(ev.data);
        if (d.event !== 'message') return;
        const txt = d.message || d.title || (d.attachment && d.attachment.name) || '';
        const p = leerLink(d.message) || leerLink(d.click) || leerLink(d.title) || leerLink(d.attachment && d.attachment.name);
        if (p) reproducir(p);
        else if (!comando(txt)) estado(listo ? 'No entendí: "' + txt.slice(0,40) + '"' : 'Primero manda una canción', false);
      } catch(_) {}
    };
    es.onerror = () => estado('Reconectando…', false);
  }

  $('activar').addEventListener('click', () => {
    $('inicio').style.display = 'none';
    $('barra').style.display = 'flex';
    estado('Conectando…', false);
    cargarYouTube();
    conectar();
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch(_) {}
    ocultarBarraLuego();
  });

  $('bPausa').addEventListener('click', () => {
    if (!listo) return;
    player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
  });
  $('bFull').addEventListener('click', () => {
    try {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    } catch(_) {}
  });

  // La barra superior se esconde sola; toca arriba para verla
  let tBarra;
  function ocultarBarraLuego(){
    $('barra').style.opacity = 1;
    clearTimeout(tBarra);
    tBarra = setTimeout(() => $('barra').style.opacity = 0, 4000);
  }
  document.addEventListener('touchstart', ocultarBarraLuego, {passive:true});
  document.addEventListener('mousemove', ocultarBarraLuego);
}
</script>
</body>
</html>
